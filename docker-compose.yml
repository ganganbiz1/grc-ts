services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: deps
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - backend
    networks:
      - grc-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: deps
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - DATABASE_URL=postgresql://grc:grc@db:5432/grc
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy
    networks:
      - grc-network

  db:
    image: postgres:17
    ports:
      - "15432:5432"
    environment:
      - POSTGRES_DB=grc
      - POSTGRES_USER=grc
      - POSTGRES_PASSWORD=grc
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc -d grc"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - grc-network

networks:
  grc-network:
    driver: bridge

volumes:
  postgres-data:
